<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b2c">
<title>Kaardimäng</title>
<style>
  :root {
    --felt: #0d3b2c; --felt-2: #124a38; --felt-3: #0a2e22;
    --line: rgba(255,255,255,.12); --ink: #f3efe2; --dim: #a9c0b4;
    --gold: #e9b949; --gold-ink: #2b2005; --card: #fbf8ef; --red: #c0302b; --black: #1c1c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: #0a2e22; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--felt-2), var(--felt) 55%, var(--felt-3));
    background-attachment: fixed; color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font: 700 30px/1.1 Georgia, "Times New Roman", serif; margin: 24px 0 4px; letter-spacing: .01em; }
  h2 { font: 700 13px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 0 0 10px; }
  p { margin: 0 0 12px; }
  .dim { color: var(--dim); }
  .panel { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(255,255,255,.08); color: var(--ink); font: inherit; font-size: 17px; outline: none;
  }
  input:focus { border-color: var(--gold); }
  input.code { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-weight: 700; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; }
  .row > .narrow { flex: 0 0 96px; }
  button {
    width: 100%; padding: 15px 16px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--gold); color: var(--gold-ink); font: 700 17px/1 system-ui, sans-serif;
    box-shadow: 0 3px 0 rgba(0,0,0,.35);
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
  button.link { background: none; box-shadow: none; color: var(--dim); font: 500 14px/1 system-ui; padding: 10px; width: auto; text-decoration: underline; }
  .mt { margin-top: 12px; }

  /* päis */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); }
  .top b { color: var(--ink); letter-spacing: .14em; }
  .game { font: 700 22px/1.15 Georgia, serif; margin: 10px 0 2px; }

  /* tabel */
  .seats { list-style: none; margin: 14px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(0,0,0,.22); }
  .seats li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .seats li:first-child { border-top: 0; }
  .seats li.out { opacity: .45; }
  .seats .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .seats .me { color: var(--gold); }
  .badge { font: 700 11px/1 system-ui; padding: 4px 7px; border-radius: 99px; background: var(--card); color: var(--black); }
  .st { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .wins { font: 700 20px/1 Georgia, serif; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .wins small { font: 500 12px/1 system-ui; color: var(--dim); }

  /* kaardid */
  .cards { display: flex; gap: 6px; }
  .card {
    flex: 1; aspect-ratio: 5 / 7; max-width: 84px; background: var(--card); color: var(--black); border-radius: 9px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.25);
  }
  .card b { font: 700 24px/1 Georgia, serif; }
  .card i { font-style: normal; font-size: 22px; line-height: 1; }
  .card.red { color: var(--red); }
  .cards.sm { gap: 4px; }
  .cards.sm .card { max-width: 42px; border-radius: 6px; box-shadow: 0 1px 0 rgba(0,0,0,.35); gap: 0; }
  .cards.sm .card b { font-size: 15px; } .cards.sm .card i { font-size: 13px; }
  button.card { padding: 0; width: auto; border: 0; cursor: pointer; }
  button.card:disabled { opacity: .4; transform: translateY(-8px); box-shadow: none; }
  .card.sel { transform: translateY(-10px); outline: 3px solid var(--gold); outline-offset: -1px; }
  .cards.many { flex-wrap: wrap; row-gap: 14px; padding-top: 8px; }
  .cards.many .card { flex: 0 0 calc(25% - 4.5px); max-width: none; }
  .seats li.turn { background: rgba(233,185,73,.12); }
  .seats li.turn .st { color: var(--gold); font-weight: 600; }
  .rule { color: var(--dim); font-size: 14px; margin: 0; }
  .rule b { color: var(--gold); }
  .card.off { opacity: .35; }
  .chk { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; font-size: 15px; color: var(--ink); cursor: pointer; }
  .chk input { width: 22px; height: 22px; padding: 0; flex: 0 0 22px; accent-color: var(--gold); }
  .hint { color: var(--dim); text-align: center; margin: 14px 0 0; font-size: 15px; }
  .back { background: repeating-linear-gradient(45deg, #8a2a2a 0 6px, #7a2222 6px 12px); border: 3px solid var(--card); }

  .mine { margin-top: 16px; }
  .mine .lbl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .mine .lbl strong { font: 700 18px/1 Georgia, serif; color: var(--gold); }
  .msg { text-align: center; padding: 18px 8px 6px; font-size: 17px; }
  .msg strong { color: var(--gold); }

  /* tulemus */
  .res h3 { font: 700 20px/1.2 Georgia, serif; margin: 0 0 12px; }
  .res .h { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .res .h:first-of-type { border-top: 0; }
  .res .h .who { flex: 1; min-width: 0; }
  .res .h .who div { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .h .who span { font-size: 12px; color: var(--dim); }
  .res .h.win .who div { color: var(--gold); }
  .res .h .cards { flex: 0 0 190px; }

  .codebox { text-align: center; }
  .codebox .big { font: 700 54px/1 Georgia, serif; letter-spacing: .18em; margin: 6px 0 12px; padding-left: .18em; }
  button.card.back { border: 3px solid var(--card); }
  .logo { background: #fff; border-radius: 16px; padding: 16px 20px; margin-top: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .logo img { display: block; width: 100%; height: auto; }
  button.info { width: 26px; height: 26px; padding: 0; margin-left: 8px; border-radius: 50%; background: transparent; border: 1px solid var(--dim);
    color: var(--ink); font: italic 700 15px/1 Georgia, serif; box-shadow: none; vertical-align: middle; }
  #help { position: fixed; inset: 0; z-index: 10; display: none; overflow-y: auto; background: rgba(3,16,11,.82); padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  #help.on { display: block; }
  #help .sheet { max-width: 520px; margin: 0 auto; background: #103f30; border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  #help .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #help .hd h1 { margin: 0; font-size: 24px; }
  #help .hd button { width: auto; padding: 10px 16px; font-size: 15px; }
  #help h2 { margin: 18px 0 8px; }
  #help ul, #help ol { margin: 0; padding-left: 20px; }
  #help li { margin: 5px 0; }
  #help details { border-top: 1px solid var(--line); }
  #help details:last-of-type { border-bottom: 1px solid var(--line); }
  #help summary { padding: 12px 0; font: 700 17px/1.2 Georgia, serif; cursor: pointer; }
  #help details[open] summary { color: var(--gold); }
  #help details ul { padding-bottom: 12px; }
  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); margin: 0 auto; max-width: 488px;
    background: #2a1414; border: 1px solid #7a3a3a; color: #ffdede; padding: 12px 14px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s; text-align: center;
  }
  #toast.on { opacity: 1; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== SEADISTUS: pane siia oma Supabase'i projekti andmed ======
// Supabase -> Project Settings -> API: "Project URL" ja "anon public" võti.
const SUPABASE_URL = 'https://pfolivhzgkeqijagzejq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmb2xpdmh6Z2tlcWlqYWd6ZWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTE5NDgsImV4cCI6MjEwNjk2Nzk0OH0.JkQrIVXT3sWBGmmk49wXYMiJnw9eTzLFv_SR8Ip3IXc';
// ================================================================

const APP_V = 4;   // suurenda koos supabase.sql-i 'v'-ga, kui äpp ja andmebaas peavad koos uuenema
const GAMES = { 1: '21 (otško)', 2: 'Pokker ilma vahetuseta', 3: 'Pokker ühe vahetusega', 4: 'Männik', 5: 'Pokker kahe vahetusega' };
const LABELS = ['Kõrge kaart', 'Paar', 'Kaks paari', 'Kolmik', 'Rida', 'Mast', 'Maja', 'Nelik', 'Mastirida'];
const RULES = {
  1: '2 kaarti, juurde võtad nii palju kui tahad. 16–21 punktiga võid võtta ühe pimeda kaardi. J = 2, Q = 3, K = 4, äss 1 või 11.',
  2: '5 kaarti, vahetusi pole. Võiduks on vaja vähemalt paari.',
  3: '5 kaarti ja üks vahetus. Võiduks on vaja vähemalt paari.',
  4: '5 kaarti ja kaks vahetust. Loevad ainult numbrid 2–10, pildid ja äss on 0.',
  5: '8 kaarti ja kaks vahetust. Esimesel vahetusel viskad vähemalt 3 ära, nii et kätte jääb 5. Võiduks on vaja vähemalt paari.'
};
const SUIT = { S: '♠', H: '♥', D: '♦', C: '♣' };
const ORDER = '23456789TJQKA';
const $app = document.getElementById('app');

let sb = null, roomId = null, S = null, lastJson = '', channel = null, timer = null, busy = false, toastT = null, sel = new Set(), selKey = '', blindSel = false;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function save(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function toast(m) {
  const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3500);
}
function cardHtml(c) {
  const r = c[0] === 'T' ? '10' : c[0], s = c[1];
  return `<span class="card${s === 'H' || s === 'D' ? ' red' : ''}"><b>${r}</b><i>${SUIT[s]}</i></span>`;
}
function cardsHtml(cs, small) {
  const sorted = [...cs].sort((a, b) => ORDER.indexOf(b[0]) - ORDER.indexOf(a[0]));
  return `<div class="cards${small ? ' sm' : ''}">${sorted.map(cardHtml).join('')}</div>`;
}
const label = (rank, game) => !rank ? ''
  : game === 1 ? (rank[0] === 0 && rank[1] > 21 ? rank[1] + ' – lõhki' : rank[1] + ' punkti')
  : game === 4 ? rank[0] + ' punkti' : LABELS[rank[0]];
const BACK = '<span class="card back"></span>';
const sortHand = cs => [...cs].sort((a, b) => ORDER.indexOf(b[0]) - ORDER.indexOf(a[0]));
function cardBtn(c, act, cls) {
  return cardHtml(c).replace('<span class="card', `<button data-act="${act}" data-card="${c}" class="card${cls || ''}`).replace('</span>', '</button>');
}
function names(list) {
  const n = list.map(esc);
  return n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' ja ' + n[n.length - 1];
}

// ---------- server ----------
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message || 'Midagi läks valesti');
  return data;
}
async function act(fn, args) {
  if (busy) return;
  busy = true;
  try { await rpc(fn, args); await refresh(); }
  catch (e) { toast(e.message); }
  finally { busy = false; }
}
async function refresh() {
  if (!roomId) return;
  let d;
  try { d = await rpc('km_state', { p_room: roomId }); }
  catch (e) {
    if (/ei ole selles toas/.test(e.message)) { leave(); toast('Seda tuba enam ei ole'); }
    return;                                   // võrguviga: proovime järgmisel korral uuesti
  }
  if (d.v > APP_V) selfUpdate(true);
  const j = JSON.stringify(d);
  if (j !== lastJson) { lastJson = j; S = d; render(); }
}
// Kui GitHubis on uuem index.html (brauser näitab vahemälust vana), laeb lehe ise uuesti.
let updTried = false;
async function selfUpdate(must) {
  if (updTried || typeof fetch !== 'function') return;
  updTried = true;
  try {
    const t = await (await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const APP_V = (\d+)/);
    if (m && +m[1] > APP_V) {
      const q = new URLSearchParams(location.search); q.set('v', m[1]);
      location.replace(location.pathname + '?' + q); return;
    }
  } catch (e) {}
  if (must) toast('Äpist on uuem versioon. Lae leht uuesti.');
}
function enter(id) {
  roomId = id; save('km_room', id); S = null; lastJson = '';
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('km-' + id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'km_rooms', filter: 'id=eq.' + id }, () => refresh())
    .subscribe();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) refresh(); }, 4000);   // varuvariant, kui Realtime ei tööta
  return refresh();
}
function leave() {
  if (channel) { sb.removeChannel(channel); channel = null; }
  clearInterval(timer); roomId = null; S = null; lastJson = ''; save('km_room', null);
  renderHome();
}

    <h1>Kaardimäng</h1>
    <p class="dim">Viis kaardimängu, 2–6 mängijat, igaühel oma telefon.</p>
    <div class="panel">
      <label for="name">Sinu nimi</label>
      <input id="name" maxlength="16" autocomplete="off" value="${esc(load('km_name') || '')}">
    </div>
    <div class="panel">
      <h2>Liitu toaga</h2>
      <div class="row">
        <div><label for="code">Toa kood</label><input id="code" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(code)}"></div>
        <div><button data-act="join">Liitu</button></div>
      </div>
    </div>
    <div class="panel">
      <h2>Uus tuba</h2>
      <div class="row">
        <div class="narrow"><label for="target">Mitme võiduni</label><input id="target" type="number" inputmode="numeric" min="1" max="50" value="5"></div>
        <div><button class="ghost" data-act="create">Loo tuba</button></div>
      </div>
    </div>
    <button class="ghost mt" data-act="help">Juhend ja reeglid</button>`;
}

function render() {
  if (!S) return renderHome();
  const R = S.room, P = S.players, me = P.find(p => p.id === S.me);
  const host = P.find(p => p.id === R.host), dealer = P.find(p => p.seat === R.dealer_seat);
  const amHost = R.host === S.me, amDealer = dealer && dealer.id === S.me;

  if (R.phase === 'lobby') {
    $app.innerHTML = `
      <div class="top"><span>Mängitakse ${R.target} võiduni <button class="info" data-act="help" aria-label="Juhend">i</button></span><button class="link" data-act="leave">Välju</button></div>
      <div class="panel codebox">
        <h2>Toa kood</h2>
        <div class="big">${esc(R.code)}</div>
        <button class="ghost" data-act="share">Kopeeri kutse link</button>
      </div>
      <ul class="seats">${P.map(p => `<li><span class="nm${p.id === S.me ? ' me' : ''}">${esc(p.name)}</span>${p.id === R.host ? '<span class="st">toa looja</span>' : ''}</li>`).join('')}</ul>
      <p class="dim mt" style="text-align:center">${P.length} mängijat toas (kuni 6)</p>
      ${amHost
        ? `<button data-act="start"${P.length < 2 ? ' disabled' : ''}>Alusta mängu</button>`
        : `<p class="msg">Ootame, kuni <strong>${esc(host.name)}</strong> mängu alustab…</p>`}`;
    return;
  }

  // ----- laud -----
  const res = R.result, G = R.game;
  const kind = R.steps[R.step - 1], nKeep = R.steps.filter(k => k === 'k').length;
  const lastSwap = kind === 'x' && R.step === R.steps.length;
  const live = R.phase === 'play' || R.phase === 'draw';
  let stepTxt = '';
  if (R.phase === 'draw') stepTxt = kind === 'h' ? 'Kaartide võtmine.' : kind === 'k' ? 'Kätte jätmine.' : `Vahetus ${R.step - nKeep}/${R.steps.length - nKeep}.`;
  else if (R.phase === 'play') stepTxt = 'Kaartide avamine.';
  const swapTxt = p => {
    if (G === 1) return p.pass ? 'jättis pimeda kinni' : p.blind ? 'pime kaart avamata' : '';
    const x = p.swaps.slice(nKeep);
    return x.length ? 'vahetas ' + x.join(', ') + (p.blind ? ' · pimesi' : '') : '';
  };
  let h = `
    <div class="top"><span>Tuba <b>${esc(R.code)}</b> · ring ${R.round_no}${R.tiebreak ? ' · lisaring' : ''}</span><span>${R.target} võiduni <button class="info" data-act="help" aria-label="Juhend">i</button></span></div>
    <div class="game">${GAMES[G]}</div>
    <p class="rule">${RULES[G] || ''}${stepTxt ? ` <b>${stepTxt}</b>` : ''}</p>
    <ul class="seats">${P.map(p => {
      let st = '';
      if (live && !p.active) st = 'vaatab pealt';
      else if (R.phase === 'play') st = p.opened ? 'valmis' : `${p.shown.length}/${p.n} avatud`;
      else if (R.phase === 'draw') {
        if (p.seat === R.turn_seat) st = kind === 'h' ? 'võtab…' : kind === 'k' ? 'valib…' : 'vahetab…';
        else if (p.swaps.length >= R.step) st = kind === 'h' ? `${p.n} kaarti${p.blind ? ', üks pime' : ''}` : kind === 'k' ? 'valis' : 'vahetas ' + p.swaps[R.step - 1] + (p.blind ? ' pimesi' : '');
        else st = 'ootab';
      }
      return `<li class="${live && !p.active ? 'out' : ''}${R.phase === 'draw' && p.seat === R.turn_seat ? ' turn' : ''}">
        <span class="nm${p.id === S.me ? ' me' : ''}">${esc(p.name)}</span>
        ${p.seat === R.dealer_seat && R.phase !== 'finished' ? '<span class="badge" title="Diiler">D</span>' : ''}
        <span class="st">${st}</span>
        <span class="wins">${p.wins}<small>/${R.target}</small></span></li>`;
    }).join('')}</ul>`;

  if (res) {
    const win = res.hands.filter(x => res.winners.includes(x.id)).map(x => x.name);
    let title;
    if (res.kind === 'win') title = R.phase === 'finished' ? `${names(win)} võitis mängu!` : `${names(win)} võitis ringi`;
    else if (res.kind === 'tie') title = `Viik: ${names(win)} – lisaring`;
    else title = `${res.game === 1 ? 'Kõik läksid lõhki' : 'Kellelgi polnud paari'} – ${res.was_tiebreak ? 'lisaring jagatakse uuesti' : 'punkti ei saanud keegi'}`;
    h += `<div class="panel res"><h2>Ring ${res.round_no} · ${GAMES[res.game]}</h2><h3>${title}</h3>${res.hands.map(x => {
      const extra = x.extra || [];
      return `
      <div class="h${res.winners.includes(x.id) ? ' win' : ''}">
        <div class="who"><div>${esc(x.name)}</div><span>${label(x.rank, res.game)}${extra.length ? ' · pime jäi kinni' : ''}</span></div>
        <div class="cards sm">${(res.game === 1 ? x.cards : sortHand(x.cards)).map(cardHtml).join('')}${extra.map(c => cardHtml(c).replace('class="card', 'class="card off')).join('')}</div>
      </div>`; }).join('')}</div>`;
  }

  if (R.phase === 'deal') {
    h += amDealer
      ? `<button class="mt" data-act="deal">${R.tiebreak ? 'Jaga lisaring' : 'Jaga kaardid'}</button>`
      : `<p class="msg">Jagab <strong>${esc(dealer.name)}</strong>…</p>`;
  } else if (R.phase === 'draw') {
    const turnP = P.find(p => p.seat === R.turn_seat), myTurn = !!turnP && turnP.id === S.me;
    const acted = me.swaps.length >= R.step;
    if (S.hand && kind === 'h') {
      // ----- 21: kaartide võtmine -----
      const t = S.hand_rank ? S.hand_rank[1] : 0, canBlind = t >= 16 && t <= 21;
      let btn;
      if (!myTurn) btn = `<p class="msg">${t > 21 ? 'Läksid lõhki. ' : ''}Võtab <strong>${esc(turnP.name)}</strong>…</p>`;
      else btn = `<div class="row mt"><button data-act="hit">Võta kaart</button><button class="ghost" data-act="stand">Jään</button></div>
        <button class="ghost mt" data-act="blind"${canBlind ? '' : ' disabled'}>Võta pime kaart</button>
        <p class="hint">Pimeda kaardi saab võtta 16–21 punktiga ja see lõpetab su käigu. Sa ei näe seda ise ka.</p>`;
      h += `<div class="panel mine">
        <div class="lbl"><h2 style="margin:0">Sinu kaardid</h2><strong>${label(S.hand_rank, G)}</strong></div>
        <div class="cards${S.hand.length + S.blind_n > 5 ? ' many' : ''}">${S.hand.map(cardHtml).join('')}${BACK.repeat(S.blind_n)}</div>
        ${btn}
      </div>`;
    } else if (S.hand) {
      // ----- vahetus -----
      const key = [R.round_no, R.step, R.tiebreak, S.hand.join('')].join(':');
      if (selKey !== key) { selKey = key; sel = new Set(); blindSel = false; }
      const n = sel.size, must = Math.max(0, S.hand.length - 5);
      let btn;
      if (!myTurn) btn = `<p class="msg">${kind === 'k' ? 'Valib' : 'Vahetab'} <strong>${esc(turnP.name)}</strong>…</p>`;
      else if (n < must) btn = `<button class="mt" data-act="swap" disabled>Märgi veel ${must - n}</button>`;
      else btn = `<button class="mt" data-act="swap">${n ? `Vaheta ${n} ${n === 1 ? 'kaart' : 'kaarti'}` : 'Ei vaheta'}</button>`;
      h += `<div class="panel mine">
        <div class="lbl"><h2 style="margin:0">Sinu kaardid</h2><strong>${label(S.hand_rank, G)}</strong></div>
        <div class="cards${S.hand.length + S.blind_n > 5 ? ' many' : ''}">${sortHand(S.hand).map(c => acted ? cardHtml(c) : cardBtn(c, 'pick', sel.has(c) ? ' sel' : '')).join('')}${BACK.repeat(S.blind_n)}</div>
        ${acted ? '' : `<p class="hint">${must ? `Märgi vähemalt ${must} kaarti, mille ära viskad. Pakist saad nii palju, et kätte jääb 5.` : 'Märgi kaardid, mida tahad vahetada.'}</p>`}
        ${lastSwap && !acted ? `<label class="chk"><input type="checkbox" data-act="blindchk"${blindSel ? ' checked' : ''}><span>Uued kaardid pimesi: näen neid alles siis, kui need lauale avan</span></label>` : ''}
        ${btn}
      </div>`;
    } else {
      h += `<p class="msg">Lisaring käib. Sina vaatad pealt.</p>`;
    }
    if (amHost && !myTurn) h += `<p style="text-align:center;margin-top:8px"><button class="link" data-act="skip">Keegi on kadunud? Jäta tema käik vahele</button></p>`;
  } else if (R.phase === 'play') {
    h += `<div class="panel res"><h2>Laud</h2>${P.filter(p => p.active).map(p => `
      <div class="h">
        <div class="who"><div>${esc(p.name)}</div><span>${swapTxt(p)}</span></div>
        <div class="cards sm">${p.shown.map(cardHtml).join('')}${BACK.repeat(Math.max(0, p.n - p.shown.length))}</div>
      </div>`).join('')}</div>`;
    if (S.hand) {
      const vis = G === 1 ? S.hand : sortHand(S.hand);
      const left = vis.some(c => !me.shown.includes(c)) || (G !== 1 && S.blind_n > 0);
      const blindOpen = G === 1 && S.blind_n > 0 && !me.pass;
      let foot;
      if (me.opened) foot = '<p class="msg">Ootame teisi…</p>';
      else foot = `<p class="hint">${blindOpen ? 'Pimeda kaardi avad ainult siis, kui tahad, et see arvesse läheks.' : S.blind_n ? 'Puuduta kaarti, et see lauale avada. Pimedat kaarti näed koos teistega.' : 'Puuduta kaarti, et see lauale avada.'}</p>
        ${blindOpen ? '<button class="ghost mt" data-act="pass">Jätan pimeda kinni</button>' : ''}
        ${left ? '<p style="text-align:center;margin:0"><button class="link" data-act="open">Ava kõik korraga</button></p>' : ''}`;
      h += `<div class="panel mine">
        <div class="lbl"><h2 style="margin:0">Sinu kaardid</h2><strong>${label(S.hand_rank, G)}</strong></div>
        <div class="cards${vis.length + S.blind_n > 5 ? ' many' : ''}">${vis.map(c => cardBtn(c, 'reveal', '').replace('<button ', me.shown.includes(c) ? '<button disabled ' : '<button ')).join('')}${me.pass ? BACK.repeat(S.blind_n) : '<button data-act="reveal" data-card="??" class="card back" aria-label="Ava pime kaart"></button>'.repeat(S.blind_n)}</div>
        ${foot}
      </div>`;
    } else {
      h += `<p class="msg">Lisaring käib. Sina vaatad pealt.</p>`;
    }
    if (amHost) h += `<p style="text-align:center;margin-top:8px"><button class="link" data-act="openall">Keegi on kadunud? Ava kõigi kaardid</button></p>`;
  } else if (R.phase === 'finished') {
    h += amHost ? `<button class="mt" data-act="again">Uus mäng</button>` : `<p class="msg">Mäng läbi. Uue mängu saab alustada <strong>${esc(host.name)}</strong>.</p>`;
  }
  h += `<p style="text-align:center;margin-top:18px"><button class="link" data-act="leave">Välju toast</button></p>`;
  $app.innerHTML = h;
}

// ---------- juhend ----------
const HELP = [
  [1, ['Igaüks saab 2 kaarti. Eesmärk on jõuda 21-le võimalikult lähedale. Üle 21 oled lõhki ja kaotad.',
       'Punktid: numbrikaardid nagu kirjas, J = 2, Q = 3, K = 4, äss 1 või 11 (äpp arvestab sulle soodsama).',
       'Oma korral võtad kaarte juurde nii palju kui tahad või jääd.',
       '16–21 punktiga võid võtta ühe pimeda kaardi. See lõpetab su käigu ja sa ei näe seda ise ka.',
       'Avamisel otsustad, kas avad pimeda (läheb arvesse) või jätad kinni (ei lähe).']],
  [2, ['Igaüks saab 5 kaarti, vahetada ei saa.', 'Võidab parim pokkerikäsi. Võiduks on vaja vähemalt paari.']],
  [3, ['Igaüks saab 5 kaarti ja ühe vahetuse: märgid kaardid, mida ei taha, ja saad pakist sama palju uusi.',
       'Vahetada võib ükskõik mitu kaarti või üldse mitte.', 'Võidab parim pokkerikäsi. Võiduks on vaja vähemalt paari.']],
  [4, ['Igaüks saab 5 kaarti ja kaks vahetust.', 'Loevad ainult numbrikaardid 2–10 oma väärtusega. Pildid ja äss annavad 0.',
       'Võidab suurim summa. Paari pole vaja.']],
  [5, ['Igaüks saab 8 kaarti ja kaks vahetust.', 'Esimesel vahetusel viskad ära vähemalt 3 kaarti ja saad pakist nii palju, et kätte jääb 5.',
       'Teine vahetus käib nagu tavaliselt.', 'Võidab parim pokkerikäsi. Võiduks on vaja vähemalt paari.']]
];
const $help = document.getElementById('help');
function openHelp() {
  const g = S && S.room.phase !== 'lobby' ? S.room.game : 0;
  $help.innerHTML = `<div class="sheet">
    <div class="hd"><h1>Juhend</h1><button class="ghost" data-close>Sulge</button></div>
    <h2>Kuidas mäng käib</h2>
    <ul>
      <li>Üks mängija loob toa ja valib, mitme võiduni mängitakse. Teised liituvad toa koodi või kutse lingiga.</li>
      <li>Viis mängu käivad kindlas järjekorras ringiratast. Iga ringi võit annab ühe punkti ja siis tuleb järgmine mäng.</li>
      <li>Igal ringil on uus diiler (märk <b>D</b>), kes vajutab „Jaga kaardid". Käigud algavad diilerist vasakult, diiler on viimane.</li>
      <li>Ringi lõpus avab igaüks oma kaardid: puuduta kaarti ja see ilmub kõigile lauale. Ava ükshaaval või kõik korraga.</li>
      <li>Viigi korral mängivad viiki jäänud samas mängus lisaringi.</li>
      <li>Kui võitjat pole (pokkeris pole kellelgi paari, 21-s läksid kõik lõhki), ei saa keegi punkti ja järgmine diiler jagab sama mängu uuesti.</li>
    </ul>
    <h2>Mängud</h2>
    ${HELP.map(([n, rows]) => `<details${n === g ? ' open' : ''}><summary>${n}. ${GAMES[n]}</summary><ul>${rows.map(r => `<li>${r}</li>`).join('')}</ul></details>`).join('')}
    <h2>Pokkerikäed tugevamast nõrgemani</h2>
    <ol>${[...LABELS].reverse().map(l => `<li>${l}</li>`).join('')}</ol>
    <h2>Hea teada</h2>
    <ul>
      <li><b>Pimesi vahetus:</b> viimasel vahetusel saad linnukesega valida, et uued kaardid jäävad sulle endale ka seljaga. Näed neid alles siis, kui need lauale avad.</li>
      <li>Teised näevad, mitu kaarti keegi vahetas või võttis, aga mitte milliseid.</li>
      <li>Kui keegi kaob ära, saab toa looja tema käigu vahele jätta või kõigi kaardid avada.</li>
      <li>Kui leht sulgub, ava see uuesti. Oled samas toas edasi.</li>
    </ul>
    <button class="mt" data-close>Sulge</button>
  </div>`;
  $help.classList.add('on'); $help.scrollTop = 0;
}
$help.addEventListener('click', ev => { if (ev.target === $help || ev.target.closest('[data-close]')) $help.classList.remove('on'); });

// ---------- nupud ----------
function readName() {
  const n = document.getElementById('name').value.trim();
  if (!n) { toast('Kirjuta kõigepealt oma nimi'); return null; }
  save('km_name', n); return n;
}
$app.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b || busy) return;
  const a = b.dataset.act;
  try {
    if (a === 'create') {
      const n = readName(); if (!n) return;
      busy = true;
      const r = await rpc('km_create_room', { p_name: n, p_target: parseInt(document.getElementById('target').value, 10) || 5 });
      busy = false; await enter(r.room_id);
    } else if (a === 'join') {
      const n = readName(); if (!n) return;
      const c = document.getElementById('code').value.trim();
      if (c.length !== 4) return toast('Toa kood on 4 tähte');
      busy = true;
      const id = await rpc('km_join_room', { p_code: c, p_name: n });
      busy = false; await enter(id);
    } else if (a === 'start') await act('km_start', { p_room: roomId });
    else if (a === 'deal') await act('km_deal', { p_room: roomId });
    else if (a === 'pick') { const c = b.dataset.card; sel.has(c) ? sel.delete(c) : sel.add(c); render(); }
    else if (a === 'blindchk') blindSel = b.checked;
    else if (a === 'swap') await act('km_swap', { p_room: roomId, p_cards: [...sel], p_blind: blindSel });
    else if (a === 'hit' || a === 'stand' || a === 'blind') await act('km_21', { p_room: roomId, p_move: a });
    else if (a === 'pass') await act('km_pass', { p_room: roomId });
    else if (a === 'skip') await act('km_skip', { p_room: roomId });
    else if (a === 'reveal') await act('km_reveal', { p_room: roomId, p_card: b.dataset.card });
    else if (a === 'open') await act('km_open', { p_room: roomId, p_all: false });
    else if (a === 'openall') await act('km_open', { p_room: roomId, p_all: true });
    else if (a === 'again') await act('km_new_game', { p_room: roomId });
    else if (a === 'help') openHelp();
    else if (a === 'leave') leave();
    else if (a === 'share') {
      const url = location.origin + location.pathname + '?tuba=' + S.room.code;
      try { await navigator.clipboard.writeText(url); toast('Link kopeeritud'); }
      catch (e) { toast(url); }
    }
  } catch (e) { busy = false; toast(e.message); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

// ---------- käivitus ----------
async function init() {
  if (!window.supabase || SUPABASE_ANON_KEY.includes('SINU-ANON')) {
    $app.innerHTML = `<h1>Kaardimäng</h1><div class="panel"><p>Supabase on seadistamata.</p>
      <p class="dim">Ava index.html ja pane faili alguses olevatesse ridadesse SUPABASE_URL ja SUPABASE_ANON_KEY oma projekti andmed.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      const { error } = await sb.auth.signInAnonymously();
      if (error) throw error;
    }
  } catch (e) {
    $app.innerHTML = `<h1>Kaardimäng</h1><div class="panel"><p>Sisselogimine ei õnnestunud.</p>
      <p class="dim">Kontrolli, et Supabase'is oleks lubatud anonüümne sisselogimine (Authentication → Sign In / Providers → Allow anonymous sign-ins).</p>
      <p class="dim">${esc(e.message || '')}</p></div>`;
    return;
  }
  selfUpdate(false);
  const saved = load('km_room');
  if (saved) { await enter(saved); if (!S && roomId) renderHome(); }
  else renderHome();
}
init();
</script>
